{% assign p = include.p %}{% if p.kind == 'link' and p.link != '' %}<a class="btn{% if include.solid %} solid{% endif %}" href="{{ p.link | relative_url }}" target="_blank" rel="noopener">↗ Visit {{ p.link_label | default: 'the site' }}</a>{% elsif p.kind == 'film' %}<a class="btn{% if include.solid %} solid{% endif %} js-play" href="{{ p.url | relative_url }}" data-video="{% if p.video != "" %}{{ p.video | relative_url }}{% endif %}" data-title="{{ p.title }}" data-sub="{{ p.subtitle }}" data-page="{{ p.url | relative_url }}">▶ Watch the film</a>{% else %}<a class="btn{% if include.solid %} solid{% endif %}" href="{{ p.url | relative_url }}">Open the case study</a>{% endif %}
