# GitHub Pages builds this site with Jekyll.
# Edit content at /admin/ : site-wide text lives in _data/site.json, each project is a file in _projects/.
title: Mohamed Ewis
url: https://mohamedewis.com
baseurl: ""   # the site is served from the root of its own domain (mohamedewis.com)
description: Creative Art Director in Dubai. Concepts, art direction, film and photography.
collections:
  projects:
    output: true
    permalink: /work/:name/
defaults:
  - scope: { type: projects }
    values: { layout: project }
exclude:
  - README.md
  - preview/
